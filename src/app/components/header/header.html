<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" routerLink="/inicio">
            La Posta
        </a>
        <div class="navbar-nav ms-auto align-items-center">
            <a class="nav-link" routerLink="/inicio" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }">
                Inicio
            </a>
            <a class="nav-link" routerLink="/categorias" routerLinkActive="active">
                Categorías
            </a>
            <button
                type="button"
                class="btn btn-outline-light position-relative ms-lg-3 mt-2 mt-lg-0 d-inline-flex align-items-center"
                (click)="cart.openCart()"
                aria-label="Abrir carrito de compras"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart me-2" viewBox="0 0 16 16">
                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                </svg>
                Carrito
                @if (cart.totalItems() > 0) {
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        {{ cart.totalItems() }}
                        <span class="visually-hidden">productos en el carrito</span>
                    </span>
                }
            </button>
        </div>
    </div>
</nav>
